# go-quake1/engine CI — vet, gofmt, and a per-package coverage gate that
# RUNS the test suite on every 64-bit arch the engine supports (amd64,
# arm64, riscv64, loong64, ppc64le, s390x). The renderer / bspfile / msg
# packages all touch little-endian-encoded data structures and the engine
# itself runs on every Go 64-bit target — running the tests under s390x
# emulation makes the byte-order paths a genuine cross-arch check.
#
# Native runners cover amd64 (ubuntu-latest) and arm64 (ubuntu-24.04-arm).
# The remaining little-endian arches plus big-endian s390x run as
# cross-compiled test binaries under QEMU via tonistiigi/binfmt.
#
# CGO=0. GOWORK=off (the engine is a standalone module, no workspace).
#
# Excluded from the package globs: `reference` (vendored C source, not
# Go), and `quake-tamago` (the bare-metal TamaGo target, which needs the
# TamaGo toolchain). go.mod has no `replace` directive and every requirement
# is a released tag, so `backend/virtio/realdev` builds and is tested here
# like any other package; the `no replace` step below keeps it that way.
#
# Coverage gate: 100% on every Go package. The bsptrace 87.8% floor
# exception was removed once the synthetic-hull backfill landed: the
# upstream tyrquake backoff loop turned out to be unreachable in the
# Go port's input domain (bias formula proof in bsptrace.go's comment
# block), and dropping it brought the package to 100%.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: off
  CGO_ENABLED: 0

jobs:
  test:
    name: vet + gofmt + per-package coverage gate (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true

      - run: go version

      # ⛔ quake-tamago is excluded EXACTLY, not as a subtree. Only the ROOT
      # package needs the TamaGo toolchain; quake-tamago/concharsfont is a
      # font-sheet builder in ordinary Go with a test that had never run.
      #
      # go.mod must not carry a replace directive: a replace to a sibling
      # directory breaks `go install` and every downstream consumer, and
      # makes CI depend on checkouts that only one machine has.
      - name: no replace directive in go.mod
        run: |
          if grep -nE '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "::error::go.mod has a replace directive: require a released tag instead"
            exit 1
          fi

      - name: go vet
        run: go vet $(go list -e ./... | grep -vE '/(reference)($|/)|/quake-tamago$')

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './reference/*' -not -path './quake-tamago/*'))
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: per-package coverage gate
        run: |
          set -euo pipefail
          fail=0
          # game/ is the real-game wiring (a quake-tamago-style integration
          # client): its tests need the real pak (gitignored copyrighted assets,
          # absent on CI) and it carries intentional defensive guards, so it is
          # excluded from the 100% line-gate here -- it is still vetted and tested
          # (against the placeholder pak) in the vet/test jobs.
          #
          # runner/ + runloop/ are the same category: the real-pak render/OCI
          # bring-up (BSP world walk, lightmaps, alias models, HUD, loading
          # panel) whose full-coverage tests likewise need real map data. They
          # are vetted + tested in the test jobs; re-tighten to the 100% gate as
          # their unit coverage lands.
          #
          # worldview + cmd/quake-worldref draw real e1m1 frames from the
          # shareware pak0.pak (never in the repository, QUAKE_PAK): their
          # tests skip without it, so the 100% gate cannot apply on CI.
          #
          # cmd/quake-wasmbox is the js/wasm entry client (its main.go only
          # builds under GOOS=js): its amd64-visible helpers (progress.go's
          # loading-bar painter) carry intentional defensive clamps -- e.g. the
          # panel/bar width guards that a valid ratio never trips -- so 100%
          # line coverage isn't reachable, same as game/.
          #
          # cmd/quake-wctr is the wasip1 playground guest: its game and
          # --worldref paths need the freepak pak0.pak (QUAKE_PAK, never in the
          # repository), so those tests skip on CI, and its surface opener is
          # wasip1-only. Its tests run in the test jobs when QUAKE_PAK is set.
          for pkg in $(go list -e ./... | grep -vE '/(reference)($|/)|/quake-tamago$|/(game|runner|runloop|worldview|render/gpuworld|cmd/quake-worldref|cmd/quake-worldcheck|cmd/quake-wasmbox|cmd/quake-wctr)($|/)'); do
            pkg_short=$(echo "$pkg" | sed 's|github.com/go-quake1/engine/||')
            out=$(go test -cover "$pkg" 2>&1 | tail -n 1)
            echo "$out"
            # Extract NN.N% (or "no statements")
            pct=$(echo "$out" | grep -oE 'coverage: [0-9.]+%' | grep -oE '[0-9.]+' || echo "")
            if [ -z "$pct" ]; then
              # "no statements" packages (e.g. anorms is a data table) -- skip the gate
              echo "  -> no statements, skipped"
              continue
            fi
            ok=$(awk -v p="$pct" 'BEGIN { print (p+0 >= 100.0) ? 1 : 0 }')
            if [ "$ok" -ne 1 ]; then
              echo "::error::$pkg_short coverage ${pct}% < 100.0%"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi

  wasm-build:
    name: build (js/wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true

      - run: go version

      - name: build backend/wasm (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./backend/wasm/

      - name: build backend/wasmbox (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./backend/wasmbox/

      - name: build cmd/quake-wasm (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /tmp/quake-wasm.wasm ./cmd/quake-wasm/

      - name: build cmd/quake-wasmbox (js/wasm)
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -o /tmp/quake-wasmbox.wasm ./cmd/quake-wasmbox/

  test-arm64:
    name: test (arm64, native)
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true

      - run: go version

      - name: go test
        run: go test $(go list -e ./... | grep -vE '/(reference)($|/)|/quake-tamago$')

  emulated:
    name: test (${{ matrix.arch }}, qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            image: debian:trixie
            qemu_cpu: rv64,v=true,vlen=128
          - arch: loong64
            image: ghcr.io/loong64/debian:trixie
            qemu_cpu: la464
          - arch: ppc64le
            image: debian:trixie
            qemu_cpu: power9
          - arch: s390x
            image: debian:trixie
            qemu_cpu: qemu
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true

      - run: go version

      - name: register QEMU binfmt handlers
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: cross-compile test binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p _qemu
          # cmd/serve-wasm is an HTTP dev server with no byte-order-sensitive
          # logic; its one-shot tests self-request a fixed localhost port to
          # drive shutdown, which hangs under emulated qemu networking (the
          # request never completes). It is fully covered on amd64 (the 100%
          # gate) and native arm64, so it adds no value under qemu -- exclude it.
          for pkg in $(go list -e ./... | grep -vE '/(reference)($|/)|/quake-tamago$|/cmd/serve-wasm($|/)'); do
            name=$(echo "$pkg" | tr '/.' '__')
            if go test -c -cover -o "_qemu/${name}.test" "$pkg"; then
              echo "built ${name}.test for $pkg"
            else
              echo "no test binary for $pkg (no tests?)"
            fi
          done

      - name: run test binaries under QEMU (${{ matrix.arch }})
        run: |
          set -euo pipefail
          shopt -s nullglob
          bins=(_qemu/*.test)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error::no test binaries were built for ${{ matrix.arch }}"
            exit 1
          fi
          for bin in "${bins[@]}"; do
            echo "::group::$bin (${{ matrix.arch }})"
            docker run --rm \
              --platform "linux/${{ matrix.arch }}" \
              -e QEMU_CPU='${{ matrix.qemu_cpu }}' \
              -v "$PWD:/work" -w /work \
              ${{ matrix.image }} \
              "/work/$bin" -test.v
            echo "::endgroup::"
          done

  # The WebGPU presenter's pixel check, in a real Chromium: the canvas is
  # read back and compared with the CPU conversion, and a planted wrong
  # palette index must fail it. macOS must get a GPU adapter
  # (QUAKE_REQUIRE_GPU fails the lane on a fallback adapter); Linux runs the
  # same check on SwiftShader, which proves correctness, never a GPU.
  # ubuntu-24.04, not -latest: browser support follows the webgpu lane.
  browser:
    name: browser (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: 'macOS, GPU required', os: macos-latest, require: '1', args: '' }
          - { lane: 'Linux, SwiftShader, correctness only', os: ubuntu-24.04, require: '0', args: '--enable-unsafe-webgpu --enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          check-latest: true
      - run: go version
      - uses: browser-actions/setup-chrome@v2
        if: runner.os == 'Linux'
        id: chrome
        with:
          chrome-version: stable
      # macOS: Chrome for Testing from Playwright (the setup-chrome one cannot
      # start its child processes on the hosted runner: mach port rendezvous
      # failures, measured on this lane). The test resolves the glob.
      - uses: actions/setup-node@v7
        if: runner.os == 'macOS'
        with: { node-version: 26 }
      - name: Playwright Chromium (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw" npx -y playwright@1.57.0 install chromium
      - name: presenter check in Chromium
        shell: bash
        env:
          QUAKE_CHROMIUM: ${{ runner.os == 'macOS' && format('{0}/pw/chromium-*/chrome-mac*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing', runner.temp) || steps.chrome.outputs.chrome-path }}
          QUAKE_REQUIRE_GPU: ${{ matrix.require }}
          QUAKE_CHROMIUM_ARGS: ${{ matrix.args }}
        run: |
          export QUAKE_PROFILE="$RUNNER_TEMP/chrome-profile"
          mkdir -p "$QUAKE_PROFILE"
          status=0
          go test -count=1 -v ./cmd/quake-presentcheck/ > "$RUNNER_TEMP/browser.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/browser.log"
          exit $status
